services:
  app:
    build:
      context: .
    container_name: todoapp
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/todo
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - mysql
    networks:
      - app-network
    volumes:
      - ./config.yml:/app/config.yml

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ridhimasql
      MYSQL_DATABASE: todo
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --bind-address=0.0.0.0   # Allow connections from all IPs
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
